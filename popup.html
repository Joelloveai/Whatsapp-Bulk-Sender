<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WhatsApp Bulk Sender Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1e2b3c 0%, #0f1a24 100%);
      color: #eef4ff;
      padding: 20px;
    }
    h3 {
      font-size: 20px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 20px;
      color: #4ade80;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-top: 12px;
      margin-bottom: 4px;
      color: #9ca3af;
    }
    textarea, input {
      width: 100%;
      padding: 8px 12px;
      background: #2d3e4f;
      border: 1px solid #4b6a7c;
      border-radius: 10px;
      color: white;
      font-size: 13px;
    }
    textarea {
      height: 100px;
      font-family: monospace;
    }
    .row {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }
    .row > div { flex: 1; }
    button {
      background: #4ade80;
      color: #0f1a24;
      border: none;
      padding: 10px 16px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-top: 16px;
      margin-right: 8px;
    }
    button:hover { background: #22c55e; transform: scale(1.02); }
    #stop { background: #ef4444; color: white; }
    #stop:hover { background: #dc2626; }
    #status {
      margin-top: 16px;
      font-size: 12px;
      text-align: center;
      padding: 8px;
      background: #2d3e4f;
      border-radius: 20px;
      color: #cbd5e1;
    }
    .pro-btn {
      background: #f59e0b;
      color: white;
      width: 100%;
      margin-top: 12px;
    }
    .pro-btn:hover { background: #d97706; }
    .small-input { width: 80px; display: inline-block; }
  </style>
</head>
<body>
  <h3>WhatsApp Bulk Sender Pro</h3>

  <!-- Paste contacts directly -->
  <label>📋 Paste contacts (one per line: number,name or just number)</label>
  <textarea id="contactsPaste" placeholder="Example:
551199999999,Joel
551188888888,Maria
551177777777"></textarea>

  <label>💬 Message (use {{name}})</label>
  <textarea id="message">Hello {{name}}, this is a test message.</textarea>

  <div class="row">
    <div><label>Min Delay (s)</label><input id="minDelay" type="number" value="7" min="1" /></div>
    <div><label>Max Delay (s)</label><input id="maxDelay" type="number" value="12" min="1" /></div>
    <div><label>Limit (0 = all)</label><input id="testCount" type="number" value="3" min="0" /></div>
  </div>

  <button id="start">Start</button>
  <button id="stop">Stop</button>
  <div id="status">Status: ready</div>
  <button id="upgradeBtn" class="pro-btn" style="display:none;">🚀 Upgrade to Pro ($4.99)</button>

  <script src="popup.js"></script>
</body>
</html>
